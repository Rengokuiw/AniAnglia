name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Allow iOS 10 deployment target in SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK path: $SDK_PATH"
          if [ -f "$SDK_PATH/SDKSettings.json" ]; then
            sudo sed -i '' -E 's/"DEPLOYMENT_TARGET_SUGGESTED_MINIMUM": "[0-9.]*"/"DEPLOYMENT_TARGET_SUGGESTED_MINIMUM": "10.0"/' "$SDK_PATH/SDKSettings.json" || true
          fi
          if [ -f "$SDK_PATH/SDKSettings.plist" ]; then
            sudo plutil -replace DefaultProperties.DEPLOYMENT_TARGET_SUGGESTED_MINIMUM -string "10.0" "$SDK_PATH/SDKSettings.plist" || true
          fi

      - name: Build project
        run: |
          xcodebuild -project AniAnglia.xcodeproj \
            -scheme iOSAnixart \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=10.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Locate .app bundle
        id: locate_app
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found"
            exit 1
          fi
          plutil -replace MinimumOSVersion -string "10.0" "$APP_PATH/Info.plist" || true
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Create Payload and package IPA
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          APP_NAME=$(basename "$APP_PATH")
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r AniAnglia-iOS10.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniAnglia-iOS10.ipa
          path: AniAnglia-iOS10.ipa
          retention-days: 7
